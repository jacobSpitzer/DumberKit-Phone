name: Build DumberKit APK (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore optional persistent debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DUMBERKIT_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          else
            echo '::warning::Debug APK key changes between GitHub runners; upgrading an existing install may require uninstalling it unless you configure a persistent signing key.'
          fi

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleFossDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          shopt -s nullglob
          apks=(app/build/outputs/apk/foss/debug/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected one APK, found ${#apks[@]}" >&2
            exit 1
          fi
          cp "${apks[0]}" release/DumberKit-Phone-debug.apk

      - name: Publish APK directly to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "manual-build-${GITHUB_RUN_NUMBER}" \
            release/DumberKit-Phone-debug.apk \
            --target "$GITHUB_SHA" \
            --title "DumberKit Phone manual build ${GITHUB_RUN_NUMBER}" \
            --notes 'Debug build for device testing; recording is not yet implemented.' \
            --prerelease
